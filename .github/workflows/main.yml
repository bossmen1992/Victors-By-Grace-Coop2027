name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract Android project
        run: |
          mkdir android-project
          unzip -q VictorsByGraceCoop2027_Android_Phone_Build.zip -d android-project

      - name: Build APK
        uses: gradle/actions/setup-gradle@v4

      - name: Run Gradle build
        run: |
          cd android-project
          gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Victors-By-Grace-Coop2027-APK
          path: android-project/app/build/outputs/apk/debug/app-debug.apk
